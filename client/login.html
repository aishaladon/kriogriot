<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krio Griot — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      color: #e8e0d0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 { font-size: 1.8rem; font-weight: 700; color: #c8a96e; }
    .logo p  { font-size: 0.85rem; color: #888; margin-top: 4px; }
    .tabs { display: flex; gap: 4px; background: #111; border-radius: 8px; padding: 4px; margin-bottom: 1.5rem; }
    .tab {
      flex: 1; padding: 8px; border: none; border-radius: 6px;
      background: transparent; color: #888; font-size: 0.9rem; cursor: pointer; transition: all .2s;
    }
    .tab.active { background: #2a2a2a; color: #e8e0d0; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #333; background: #111; color: #e8e0d0;
      font-size: 0.95rem; margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #c8a96e; }
    .btn {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      background: #c8a96e; color: #0f0f0f; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
      width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #333;
      background: transparent; color: #888; font-size: 0.9rem;
      cursor: pointer; transition: all .2s; margin-top: 8px;
    }
    .btn-ghost:hover { border-color: #555; color: #e8e0d0; }
    .error   { color: #e57373; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .success { color: #81c784; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .forgot-link {
      display: block; text-align: right; font-size: 0.82rem;
      color: #888; text-decoration: none; margin-top: -0.5rem; margin-bottom: 1rem;
    }
    .forgot-link:hover { color: #c8a96e; }
    .view { display: none; }
    .view.active { display: block; }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.85rem; color: #888; cursor: pointer;
      margin-bottom: 1.5rem; background: none; border: none; padding: 0;
    }
    .back-link:hover { color: #c8a96e; }
    .section-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
    .section-sub   { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Krio Griot</h1>
    <p>Legacy Research &amp; Genealogy</p>
  </div>

  <!-- ── Login only (registration is invite/admin only during beta) ── -->
  <div id="view-auth" class="view active">
    <div id="error-msg" class="error"></div>
    <div id="success-msg" class="success"></div>

    <!-- Login form -->
    <form id="form-login" onsubmit="doLogin(event)">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" required />
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" required />
      <a class="forgot-link" href="#" onclick="showView('forgot'); return false;">Forgot password?</a>
      <button class="btn" type="submit" id="btn-login">Sign In</button>
    </form>
    <p style="text-align:center;font-size:.8rem;color:#555;margin-top:1.2rem;">Krio Griot is currently in private beta.</p>
  </div>

  <!-- ── Forgot password ── -->
  <div id="view-forgot" class="view">
    <button class="back-link" onclick="showView('auth')">&#8592; Back to Sign In</button>
    <div class="section-title">Forgot Password</div>
    <div class="section-sub">Enter your email and we'll send you a reset link.</div>

    <div id="forgot-error" class="error"></div>
    <div id="forgot-success" class="success"></div>

    <form onsubmit="doForgot(event)">
      <label>Email</label>
      <input type="email" id="forgot-email" placeholder="you@example.com" required />
      <button class="btn" type="submit" id="btn-forgot">Send Reset Link</button>
    </form>
  </div>

  <!-- ── Reset password ── -->
  <div id="view-reset" class="view">
    <button class="back-link" onclick="showView('auth')">&#8592; Back to Sign In</button>
    <div class="section-title">Reset Password</div>
    <div class="section-sub">Enter your new password below.</div>

    <div id="reset-error" class="error"></div>
    <div id="reset-success" class="success"></div>

    <form onsubmit="doReset(event)">
      <label>New Password</label>
      <input type="password" id="reset-password" placeholder="Min 8 characters" required />
      <label>Confirm Password</label>
      <input type="password" id="reset-confirm" placeholder="Re-enter password" required />
      <button class="btn" type="submit" id="btn-reset">Set New Password</button>
    </form>
  </div>
</div>

<script>
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
}


function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}
function showSuccess(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}
function clearMessages() {
  ['error-msg','success-msg','forgot-error','forgot-success','reset-error','reset-success']
    .forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
}

async function doLogin(e) {
  e.preventDefault();
  clearMessages();
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:    document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) { showError('error-msg', data.error || 'Login failed.'); return; }
    localStorage.setItem('kg_token', data.token);
    localStorage.setItem('kg_user',  JSON.stringify(data.user));
    window.location.href = '/app';
  } catch (err) {
    showError('error-msg', 'Network error. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function doRegister(e) {
  e.preventDefault();
  clearMessages();
  const btn = document.getElementById('btn-register');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name:     document.getElementById('reg-name').value,
        email:    document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) { showError('error-msg', data.error || 'Registration failed.'); return; }
    localStorage.setItem('kg_token', data.token);
    localStorage.setItem('kg_user',  JSON.stringify(data.user));
    window.location.href = '/app';
  } catch (err) {
    showError('error-msg', 'Network error. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

async function doForgot(e) {
  e.preventDefault();
  clearMessages();
  const btn = document.getElementById('btn-forgot');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('forgot-email').value }),
    });
    const data = await res.json();
    if (!res.ok) { showError('forgot-error', data.error || 'Something went wrong.'); return; }
    showSuccess('forgot-success', 'If an account exists for that email, a reset link has been sent. Check your inbox.');
  } catch (err) {
    showError('forgot-error', 'Network error. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
}

async function doReset(e) {
  e.preventDefault();
  clearMessages();
  const password = document.getElementById('reset-password').value;
  const confirm  = document.getElementById('reset-confirm').value;
  if (password !== confirm) { showError('reset-error', 'Passwords do not match.'); return; }
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) { showError('reset-error', 'Invalid reset link. Please request a new one.'); return; }
  const btn = document.getElementById('btn-reset');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if (!res.ok) { showError('reset-error', data.error || 'Reset failed.'); return; }
    showSuccess('reset-success', 'Password updated! Redirecting to sign in…');
    setTimeout(() => { window.location.href = '/login'; }, 2000);
  } catch (err) {
    showError('reset-error', 'Network error. Please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Set New Password';
  }
}

// Route to correct view based on URL
const path = window.location.pathname;
const params = new URLSearchParams(window.location.search);
if (params.get('token')) {
  showView('reset');
} else if (path === '/forgot-password') {
  showView('forgot');
} else {
  showView('auth');
}

// If already logged in and not on reset page, redirect to app
if (localStorage.getItem('kg_token') && !params.get('token')) {
  window.location.href = '/app';
}
</script>
</body>
</html>
